# When a thing may stop — deliberately NOT the inverse of `needs`, because
# things also get started by hand, by onboot, or by another service.
#
# `manages` is the whole safety story: ONLY what is named here is ever
# stopped. Anything else simply keeps its machine up.

console:
  stop_when:
    - "!console_in_use"    # a POSITIVE answer that nobody is on it
    - "!hold:console"      # nobody has asked us to keep it
  grace: 2m
  then_consider: [tower] # stopping this may have freed the tower
  manages: [console]

pbs:
  stop_when:
    - "!pbs_working"
    - "!hold:pbs"
  grace: 1m
  then_consider: [tower]
  manages: [pbs]

tower:
  stop_when:
    - "!any_guest_running" # measured — a guest started by hand keeps it up
    - "!human_session"
    - "!converge_running"
    - "!hold:tower"
    - "cluster_whole"      # the fencing rule, as an ordinary signal
  grace: 10m
  manages: [tower]
