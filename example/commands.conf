# /etc/veilleur/commands.conf — rendered onto EACH NODE beside the forced
# command. Le Veilleur names these; it never sends a command.
#
# This is tower's copy. Note what is absent as much as what is here:
# node-a's and node-b's copies carry no `down:tower` and no `down:` for
# themselves at all, so they cannot be made to sleep however they are asked.

signal:console_in_use=conntrack -L -d 192.0.2.21 -p tcp --state ESTABLISHED 2>/dev/null | grep -qE 'dport=(47984|47989|48010|22) '
signal:pbs_working=conntrack -L -d 192.0.2.14 -p tcp --state ESTABLISHED 2>/dev/null | grep -qE 'dport=(8007|22) '
signal:any_guest_running=qm list | awk 'NR>1 && $3=="running"{f=1} END{exit !f}'
signal:human_session=who | awk '$2 ~ /^(pts|tty)/{f=1} END{exit !f}'
signal:cluster_whole=python3 -c "import json,sys; m=json.load(open('/etc/pve/.members'))['nodelist']; sys.exit(0 if all(n.get('online')==1 for n in m.values()) else 1)"

state:tower=python3 -c "import json,sys; m=json.load(open('/etc/pve/.members'))['nodelist']; sys.exit(0 if m.get('tower',{}).get('online')==1 else 1)"
state:console=qm status 5001 2>/dev/null | grep -q running
state:pbs=qm status 1002 2>/dev/null | grep -q running

up:console=qm start 5001
down:console=qm shutdown 5001 --timeout 300
up:pbs=qm start 1002
down:pbs=qm shutdown 1002 --timeout 300

# only the on-demand node's own copy carries this
down:tower=systemctl poweroff
