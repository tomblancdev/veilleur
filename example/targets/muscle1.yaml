muscle1:
  kind: node
  node: muscle1
  label: "the on-demand tower"
  on_demand: true        # REQUIRED — a node that has not said this can never be a target
  up_timeout: 3m
  min_uptime: 5m
  # No wake backstop here on purpose: the machine arms its own RTC alarm at
  # its own shutdown. If it were armed by Le Veilleur, a compromised watchman
  # could silently stop the backups from ever waking the tower.
